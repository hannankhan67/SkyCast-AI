version: '3.8'

services:
  # 1. MongoDB Service
  mongodb:
    image: mongo:6.0
    container_name: skycast_mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB_NAME}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Mongo Express Web Admin UI
  mongo-express:
    image: mongo-express:latest
    container_name: skycast_mongo_express
    restart: always
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_MONGODB_PORT: 27017
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_ROOT_USER}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_ROOT_PASSWORD}
      ME_CONFIG_MONGODB_ENABLE_ADMIN: "true"
      ME_CONFIG_BASICAUTH_USERNAME: ${ME_USERNAME}
      ME_CONFIG_BASICAUTH_PASSWORD: ${ME_PASSWORD}
    depends_on:
      mongodb:
        condition: service_healthy

  # 3. Flask Web Application
  web:
    build: .
    container_name: skycast_web
    restart: always
    command: python app.py
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongodb:27017/${MONGO_DB_NAME}?authSource=admin
      - FLASK_ENV=${FLASK_ENV}
      - SECRET_KEY=${SECRET_KEY}
    depends_on:
      mongodb:
        condition: service_healthy

  # 4. Open-Meteo Background Sync Worker
  worker:
    build: .
    container_name: skycast_worker
    restart: always
    command: python celery_worker.py
    environment:
      - MONGO_URI=mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongodb:27017/${MONGO_DB_NAME}?authSource=admin
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_started

  # 5. Redis (for Celery task queue)
  redis:
    image: redis:7-alpine
    container_name: skycast_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # 6. Celery Worker (alerts + heavy task processing)
  celery-worker:
    build: .
    container_name: skycast_celery_worker
    restart: always
    command: python celery_worker.py
    environment:
      - MONGO_URI=mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongodb:27017/${MONGO_DB_NAME}?authSource=admin
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
      - mongodb

volumes:
  mongo_data:
  redis_data: