<!-- Floating parallax clouds (behind everything) -->
<div class="cloud-container absolute inset-0 w-full h-full overflow-hidden pointer-events-none -z-10">
    <div class="cloud cloud-slow opacity-40 scale-125" style="top: 15%; animation-delay: -2s;"><div class="cloud-shape"></div></div>
    <div class="cloud cloud-medium opacity-60" style="top: 30%; animation-delay: -10s;"><div class="cloud-shape"></div></div>
    <div class="cloud cloud-fast opacity-50 scale-75" style="top: 50%; animation-delay: -18s;"><div class="cloud-shape"></div></div>
    <div class="cloud cloud-slowest opacity-30 scale-150" style="top: 70%; animation-delay: -25s;"><div class="cloud-shape"></div></div>
</div>
